name: Release

# Pushing a tag such as v0.9.0-beta.6 builds the installer and the extension on a clean
# machine, checks that the installer installs, and puts it in a draft release.
# Started by hand, it does the same but makes no release: a trial of the build.
#
# With SignPath set up (see docs/SIGNING.md), the installer is signed before it is tested
# and released. Without it, the installer stays unsigned, as before.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: The tag matches the version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "package.json says $version" }

      - run: npm run dist

      - run: npm run build:extension

      - name: Name the installer without spaces
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'LocalPDF Setup *.exe' | Select-Object -First 1
          $named = Join-Path release ($installer.Name -replace ' ', '.')
          Move-Item $installer.FullName $named
          "path=$named" >> $env:GITHUB_OUTPUT

      # Signing: the unsigned installer goes to SignPath as an artifact and comes back signed.
      - name: Hand the installer over for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: ${{ steps.installer.outputs.path }}
          retention-days: 1

      - name: Sign it with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Put the signed installer in place, and check its signature
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $installer = '${{ steps.installer.outputs.path }}'
          $signed = Get-ChildItem signed -Recurse -Filter (Split-Path $installer -Leaf) | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no installer' }
          Copy-Item $signed.FullName $installer -Force
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "The signature is not valid: $($signature.Status) $($signature.StatusMessage)" }
          "Signed by: $($signature.SignerCertificate.Subject)"

      - name: Install it silently
        shell: pwsh
        run: |
          Start-Process -FilePath '${{ steps.installer.outputs.path }}' -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\localpdf\LocalPDF.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }

      - name: Draft the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = '${{ steps.installer.outputs.path }}'
          $hash = (Get-FileHash $installer).Hash
          $signed = (Get-AuthenticodeSignature $installer).Status -eq 'Valid'
          "SHA-256 of the installer: ``$hash``" | Out-File notes.md -Encoding utf8
          "Signed: $(if ($signed) { 'yes' } else { 'no' })" | Out-File notes.md -Encoding utf8 -Append
          gh release create '${{ github.ref_name }}' $installer --draft --prerelease --title "LocalPDF ${{ github.ref_name }}" --notes-file notes.md

      # The extension is for the Chrome Web Store, not for the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: release/LocalPDF-extension-*.zip
          retention-days: 30
